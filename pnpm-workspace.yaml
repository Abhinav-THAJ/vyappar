# Packages whose install scripts are allowed to run.
# Prisma needs its engines, embedded-postgres extracts the PostgreSQL binaries,
# esbuild and unrs-resolver fetch their native binaries, sharp its image codecs.
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
